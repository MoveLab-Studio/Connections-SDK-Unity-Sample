# -Xss16m: D8 dexing of the SDK's Kotlin bytecode recurses deeply and overflows the default
# thread stack (StackOverflowError "Error while dexing"). 16m matches Unity's older default.
org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M -Xss16m
org.gradle.parallel=true
unityStreamingAssets=**STREAMING_ASSETS**
# Android Resolver Properties Start
android.useAndroidX=true
android.enableJetifier=false
# Android Resolver Properties End
**ADDITIONAL_PROPERTIES**
